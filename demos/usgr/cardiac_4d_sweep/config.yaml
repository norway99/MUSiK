# Cardiac 4D sweep configuration. Every value marked TODO is an open decision (see plan.md).
# Lengths are in mm unless the key says otherwise. The world frame is the cropped phantom
# grid, centered on its middle voxel (MUSiK's convention), with axes in the mask's array
# order. For the bavcta021 TIFF that is (Z, Y, X) = (inferior, posterior, patient-left),
# which is right-handed; don't transpose it.

paths:
  mask: /home/trevor/repos/MUSiK/assets/cardiac_4d_phantom/img4d_CT_bavcta021_baseline_seg4d.tif
  output_root: /data/trevor/usgr/simulations_raw/cardiac_4d_sweep

mask:
  spacing_mm: [0.4, 0.39589062, 0.39589062]     # (Z, Y, X), from the embedded NIfTI header
  # mask value -> tissue name. Values not listed fall back to `default_tissue`.
  # Frame 0 is about end-diastole, frames 7-8 about end-systole.
  labels:
    1: myocardium    # LV myocardium
    2: blood         # LA blood pool
    3: blood         # LV blood pool
    4: blood         # RA blood pool
    5: blood         # RV blood pool
    6: blood         # aorta (root, arch, descending); no vessel wall labelled
    7: blood         # pulmonary artery; no vessel wall labelled
    8: myocardium    # RV myocardium
    9: myocardium    # LA wall (TODO: same tissue as ventricular myocardium?)
    10: myocardium   # RA wall
  heart_labels: [1, 2, 3, 4, 5, 8, 9, 10]       # chambers and walls; excludes the great vessels
  chambers:                                     # coverage groups for trajectory QA
    LV: [1, 3]
    RV: [5, 8]
    LA: [2, 9]
    RA: [4, 10]

tissues:                                        # TODO: tune; c [m/s], rho [kg/m^3], sigma [m/s], scale [m]
  blood:      {c: 1578, rho: 1060, sigma: 1.3, scale: 0.00001}
  myocardium: {c: 1592, rho: 1081, sigma: 20,  scale: 0.0001}
  soft:       {c: 1540, rho: 1040, sigma: 3,   scale: 0.0001}
default_tissue: soft                            # everything unlabelled: the mask has no chest wall or lungs

phantom:
  voxel_size_mm: 0.5                            # TODO: phantom resampling resolution
  # Background kept around the labelled region on every side. Lookups past the grid clamp
  # to edge labels, so this only has to keep the edges background; probes may sit outside.
  margin_mm: 10
  seed: 1
  # Generate texture on each simulation grid as a hash of world position, so every scan
  # line, image and cardiac phase sees the same scatterers. Otherwise MUSiK draws fresh
  # speckle for every simulation. Needs `seed`.
  world_texture: true

cardiac:
  num_frames: 20
  heart_rate_bpm: 71                            # not commensurate with the frame rate, so every CT frame gets sampled
  phase_offset: 0.0                             # cardiac phase in [0, 1) at t = 0

acquisition:
  frame_rate_hz: 10                             # with trajectory.duration_s, sets the image count
  image_size: [512, 512]
  fov_degrees: 90                               # 48 lines over 90 deg is ~1.9 deg per line
  depth_mm: 160

transducer:
  max_frequency: 0.75e+6                        # main cost knob (voxel size scales with 1/f)
  elements: 64
  width_mm: 20
  height_mm: 12
  focus_azimuth_mm: 80
  focus_elevation_mm: 80
  cycles: 2
  ray_num: 48
  sensor_sampling_scheme: not_centroid
  receive_apodization: Rectangular              # Hanning tested: no clutter benefit, broader lateral speckle

simulation:
  # The grid only needs to enclose one steered beam: MUSiK rotates it per scan line.
  # Voxel size follows from `transducer.max_frequency` (MUSiK uses a quarter wavelength).
  grid_size_mm: [170, 25, 15]                   # depth x lateral x elevation (MUSiK widens to >= 1.5x aperture)
  PML_size: [16, 8, 8]
  PML_alpha: 2
  alpha_coeff: 0.5
  alpha_power: 1.5
  bona: 6
  prep_workers: 1                               # CPU processes preparing simulations (~0.1-0.2 s each)
  sim_workers: 3                                # concurrent simulations per GPU; fills the idle time between short k-Wave runs
  gpus: [0, 1]                                  # devices to run on (indices into the visible devices)
  nodes: 1

# One continuous trajectory through the keyframes of every section, in order. Positions
# and targets are mm relative to the heart center. The beam points from `position` to
# `target`; `lateral` (per section or keyframe) is the world direction the image's lateral
# axis roughly follows, and `roll_deg` then spins the image about the beam. A keyframe
# without a target is a position-only waypoint whose orientation is interpolated. Keyframes
# have no times: intervals are timed by the speed limits, then scaled to `duration_s`.
# Rotation splines take the short way, so keep consecutive keyframes < 180 deg apart.
#
# Landmarks (mm from heart center, Z inferior / Y posterior / X patient-left): LV blood
# [0, 10, 23], apex [10, -27, 55], base [-8, 43, -5], RV [6, -25, -4]. LV axis base->apex
# [0.19, -0.74, 0.64]; chambers span -76 (top of LA) to +53 mm along it from LV center.
trajectory:
  duration_s: 100                               # 1000 images at 10 Hz
  max_rotation_dps: 15
  max_translation_mmps: 25
  link_speed_fraction: 0.9                      # links peak at this fraction of the limits; sweeps get the rest of the time
  sections:
    - name: parasternal_short_axis              # short-axis fan from above the atria to below the apex
      lateral: [0.19, -0.74, 0.64]              # LV axis; roll 90 turns the image to short axis
      keyframes:
        - {position: [-10, -85, 10], target: [-16, 74, -32], roll_deg: 90}   # LV center - 86 mm along axis
        - {position: [-10, -85, 10], target: [0, 10, 23],    roll_deg: 90}   # LV center
        - {position: [-10, -85, 10], target: [10, -28, 56],  roll_deg: 90}   # LV center + 52 mm (last plane that sees the heart)
    - name: to_apical
      link: true
      keyframes:
        - {position: [3, -76, 47]}                                           # pushed outward from the straight path
    - name: apical_rotation                     # 4-chamber -> 2-chamber -> mirrored 4-chamber
      lateral: [-6, 35, 27]                     # RV -> LV direction (4-chamber view at roll 0)
      keyframes:
        - {position: [16, -49, 74], target: [-4, 25, 10], roll_deg: 0}
        - {position: [16, -49, 74], target: [-4, 25, 10], roll_deg: 90}
        - {position: [16, -49, 74], target: [-4, 25, 10], roll_deg: 180}
    - name: to_subcostal
      link: true
      keyframes:
        - {position: [51, -59, 44]}                                          # keeps clear of the inferior wall
    - name: subcostal_fan                       # front -> back through the heart
      lateral: [0, 0, 1]                        # patient left-right; roll 360 (= 0) continues the apical roll instead of unwinding it
      keyframes:
        - {position: [70, -50, 0], target: [-38, -53, 0], roll_deg: 360}     # center - 66 mm along the fan direction
        - {position: [70, -50, 0], target: [0, 0, 0],     roll_deg: 360}
        - {position: [70, -50, 0], target: [26, 36, 0],   roll_deg: 360}     # center + 44 mm

reconstruction:
  tgc: 1.0                                      # attenuation_factor passed to MUSiK's gain compensation
  num_depth_samples: 1024                       # polar resampling before scan conversion
  dynamic_range_db: 50                          # TODO
  reference_percentile: 99.5                    # one global log-compression reference for the whole sweep
